<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Feasibility Study Review</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f3ec; --bg2:#efe9dd; --surface:#ffffff; --surface2:#faf7f1; --line:#e4dccb; --line2:#d8cdb6;
  --ink:#16182b; --ink2:#4a4e68; --muted:#80849c;
  --brand:#2a2f8f; --brand2:#4b52d6; --accent:#f2a516; --accent2:#ffcf5a;
  --ok:#119a62; --ok-bg:#e3f6ec; --bad:#d63a4a; --bad-bg:#fde7e9;
  --s1:#4b52d6; --s2:#0e9f9a; --s4:#e08a00; --s5:#2f9e44; --sx:#c2417a;
  --shadow:0 1px 2px rgba(22,24,43,.06),0 8px 24px -12px rgba(22,24,43,.18);
  --shadow-lg:0 30px 60px -30px rgba(22,24,43,.35);
  --r:18px; --r-sm:12px;
  --grid:rgba(42,47,143,.06);
}
[data-theme="dark"]{
  --bg:#0b0d1a; --bg2:#10132a; --surface:#141833; --surface2:#191e3d; --line:#252b52; --line2:#323a6b;
  --ink:#eef0ff; --ink2:#b8bce0; --muted:#7f85b3;
  --brand:#9aa1ff; --brand2:#7c84ff; --accent:#ffbe3b; --accent2:#ffd86b;
  --ok:#37d38c; --ok-bg:rgba(55,211,140,.12); --bad:#ff6577; --bad-bg:rgba(255,101,119,.12);
  --s1:#8b91ff; --s2:#2fd3cc; --s4:#ffb02e; --s5:#5fd36f; --sx:#ff7ab3;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7);
  --shadow-lg:0 30px 70px -30px rgba(0,0,0,.8);
  --grid:rgba(154,161,255,.05);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Plus Jakarta Sans","Cairo",system-ui,sans-serif; font-size:16px; line-height:1.7;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:32px 32px; transition:background-color .3s,color .3s;
  -webkit-font-smoothing:antialiased;
}
html[lang="ar"] body{font-family:"Cairo","Plus Jakarta Sans",system-ui,sans-serif}
.en{direction:ltr;unicode-bidi:isolate;font-family:"Plus Jakarta Sans","Cairo",sans-serif}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
a{color:inherit}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}

/* ===== Top bar ===== */
.top{position:sticky;top:0;z-index:50;backdrop-filter:blur(14px) saturate(1.4);-webkit-backdrop-filter:blur(14px) saturate(1.4);
  background:color-mix(in srgb,var(--bg) 78%,transparent);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:14px;height:66px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.01em;font-size:17px;white-space:nowrap}
.logo-mark{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--brand2),var(--brand));color:#fff;box-shadow:0 6px 16px -6px var(--brand2)}
[data-theme="dark"] .logo-mark{color:#0b0d1a}
.logo small{display:block;font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.02em;line-height:1.1}
.nav{display:flex;gap:4px;margin-inline-start:auto;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button{padding:8px 13px;border-radius:999px;font-size:14px;font-weight:700;color:var(--ink2);white-space:nowrap;transition:.2s}
.nav button:hover{background:var(--surface2);color:var(--ink)}
.nav button.on{background:var(--ink);color:var(--bg)}
.tools{display:flex;gap:8px}
.tbtn{height:40px;min-width:40px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);
  display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:800;font-size:13px;transition:.2s;box-shadow:var(--shadow)}
.tbtn:hover{border-color:var(--brand2);transform:translateY(-1px)}
.tbtn svg{width:18px;height:18px}
@media (max-width:860px){.nav{display:none}.top .wrap{justify-content:space-between}}

/* mobile section bar */
.mnav{display:none;gap:6px;overflow-x:auto;padding:10px 20px;border-bottom:1px solid var(--line);scrollbar-width:none}
.mnav::-webkit-scrollbar{display:none}
.mnav button{padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:700;white-space:nowrap}
.mnav button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
@media (max-width:860px){.mnav{display:flex}}

/* ===== Hero ===== */
.hero{padding:56px 0 30px;position:relative}
.eyebrow{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);
  font-size:13px;font-weight:700;color:var(--ink2)}
.eyebrow i{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 25%,transparent)}
.hero h1{font-size:clamp(34px,5.6vw,64px);line-height:1.08;margin:18px 0 14px;letter-spacing:-.03em;font-weight:800}
html[lang="ar"] .hero h1{line-height:1.3;letter-spacing:0}
.hero h1 .hl{background:linear-gradient(120deg,var(--brand2),var(--sx) 60%,var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p.lead{font-size:18px;color:var(--ink2);max-width:640px;margin:0}
.stats{display:flex;gap:12px;flex-wrap:wrap;margin-top:26px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 18px;box-shadow:var(--shadow);min-width:130px}
.stat b{display:block;font-size:26px;line-height:1.1;font-weight:800}
.stat span{font-size:13px;color:var(--muted);font-weight:600}

/* ===== Section cards (home) ===== */
.secgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;padding:16px 0 30px}
@media (max-width:760px){.secgrid{grid-template-columns:1fr}}
.scard{--c:var(--s1);position:relative;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:24px;overflow:hidden;
  box-shadow:var(--shadow);transition:transform .25s,box-shadow .25s,border-color .25s}
.scard:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);border-color:color-mix(in srgb,var(--c) 45%,var(--line))}
.scard::before{content:"";position:absolute;inset:0 0 auto 0;height:5px;background:var(--c)}
.scard .num{position:absolute;inset-inline-end:18px;top:6px;font-size:96px;font-weight:800;line-height:1;color:var(--c);opacity:.10;letter-spacing:-.05em}
.scard .tag{display:inline-block;font-size:12px;font-weight:800;color:var(--c);background:color-mix(in srgb,var(--c) 12%,transparent);padding:4px 10px;border-radius:999px}
.scard h3{font-size:23px;margin:10px 0 4px;line-height:1.3}
.scard p{margin:0 0 16px;color:var(--ink2);font-size:15px}
.topics{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px}
.topics span{font-size:12px;font-weight:700;padding:4px 9px;border-radius:8px;background:var(--surface2);border:1px solid var(--line);color:var(--ink2)}
.prog{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--c),color-mix(in srgb,var(--c) 60%,#fff));border-radius:99px;transition:width .6s}
.progtxt{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-weight:700;margin:8px 0 16px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:13px;font-weight:800;font-size:15px;transition:.2s;border:1px solid transparent}
.btn svg{width:18px;height:18px}
.btn.pri{background:var(--c,var(--brand2));color:#fff;box-shadow:0 8px 20px -10px var(--c,var(--brand2))}
[data-theme="dark"] .btn.pri{color:#0b0d1a}
.btn.pri:hover{filter:brightness(1.08);transform:translateY(-1px)}
.btn.sec{background:var(--surface2);border-color:var(--line);color:var(--ink)}
.btn.sec:hover{border-color:var(--c,var(--brand2))}
.btn.ghost{color:var(--ink2)}
.btn.ghost:hover{color:var(--ink);background:var(--surface2)}
.btn:disabled{opacity:.4;pointer-events:none}

.examcard{--c:var(--sx);background:linear-gradient(135deg,#1b1f4b,#2a2f8f 55%,#5b2a86);color:#fff;border-radius:24px;padding:30px;position:relative;overflow:hidden;box-shadow:var(--shadow-lg);margin-bottom:40px}
.examcard::after{content:"";position:absolute;width:340px;height:340px;border-radius:50%;inset-inline-end:-90px;top:-120px;background:radial-gradient(circle,rgba(255,190,59,.55),transparent 65%)}
.examcard h3{font-size:28px;margin:0 0 6px;position:relative;z-index:1}
.examcard p{margin:0 0 18px;opacity:.85;position:relative;z-index:1;max-width:560px}
.examcard .opts{position:relative;z-index:1;display:flex;flex-wrap:wrap;gap:18px;align-items:flex-end}
.examcard label.lbl{display:block;font-size:12px;font-weight:800;opacity:.75;margin-bottom:6px;letter-spacing:.03em}
.seg{display:inline-flex;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:12px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{padding:7px 12px;border-radius:9px;font-weight:800;font-size:13px;color:#fff;opacity:.8}
.seg button.on{background:#fff;color:#1b1f4b;opacity:1}
.examcard .btn.pri{background:var(--accent);color:#1b1f4b;box-shadow:0 10px 24px -10px var(--accent)}

/* ===== Page head ===== */
.phead{padding:38px 0 18px}
.crumbs{font-size:13px;font-weight:700;color:var(--muted);display:flex;gap:8px;align-items:center}
.crumbs button{color:var(--muted);font-weight:700}.crumbs button:hover{color:var(--ink)}
.phead h1{font-size:clamp(28px,4vw,44px);margin:10px 0 6px;line-height:1.2;letter-spacing:-.02em}
.phead p{margin:0;color:var(--ink2);font-size:17px}
.subtabs{display:inline-flex;gap:4px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-top:20px;box-shadow:var(--shadow)}
.subtabs button{padding:9px 18px;border-radius:10px;font-weight:800;font-size:14px;color:var(--ink2);display:inline-flex;align-items:center;gap:8px}
.subtabs button.on{background:var(--c);color:#fff}
[data-theme="dark"] .subtabs button.on{color:#0b0d1a}
.subtabs svg{width:16px;height:16px}

/* ===== Lesson ===== */
.lesson{padding:10px 0 60px}
.blk{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:26px;margin-bottom:18px;box-shadow:var(--shadow)}
.blk>h2{display:flex;align-items:center;gap:12px;margin:0 0 6px;font-size:22px;line-height:1.35}
.blk>h2 .n{flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:15px;font-weight:800;background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c)}
.blk>.sub{color:var(--muted);margin:0 0 18px;font-size:15px}
.blk p{margin:0 0 12px}
.term{font-weight:800;color:var(--c);direction:ltr;unicode-bidi:isolate}
.k{font-weight:800}
.g2,.g3,.g4{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
@media (max-width:860px){.g3,.g4{grid-template-columns:repeat(2,1fr)}}
@media (max-width:560px){.g2,.g3,.g4{grid-template-columns:1fr}}
.tile{background:var(--surface2);border:1px solid var(--line);border-radius:16px;padding:16px;position:relative}
.tile .ic{font-size:22px;line-height:1;margin-bottom:8px}
.tile h4{margin:0 0 4px;font-size:16px;line-height:1.35}
.tile h4 .en{color:var(--c)}
.tile p{margin:0;font-size:14px;color:var(--ink2);line-height:1.6}
.tile.hl{border-color:color-mix(in srgb,var(--c) 40%,var(--line));background:color-mix(in srgb,var(--c) 7%,var(--surface2))}
.vsbox{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:stretch}
@media (max-width:700px){.vsbox{grid-template-columns:1fr}.vsbox .vs{justify-self:center}}
.vsbox .vs{align-self:center;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:var(--ink);color:var(--bg);font-size:14px}
.side{border-radius:18px;padding:20px;border:1.5px solid}
.side.a{border-color:color-mix(in srgb,var(--s1) 40%,transparent);background:color-mix(in srgb,var(--s1) 7%,transparent)}
.side.b{border-color:color-mix(in srgb,var(--sx) 40%,transparent);background:color-mix(in srgb,var(--sx) 7%,transparent)}
.side h3{margin:0;font-size:20px}
.side .q{font-size:15px;font-weight:800;margin:4px 0 12px;opacity:.9}
.side.a h3,.side.a .q{color:var(--s1)}.side.b h3,.side.b .q{color:var(--sx)}
ul.ck{list-style:none;padding:0;margin:0}
ul.ck li{position:relative;padding-inline-start:26px;margin:6px 0;font-size:15px}
ul.ck li::before{content:"";position:absolute;inset-inline-start:0;top:.55em;width:14px;height:14px;border-radius:5px;background:var(--c);opacity:.85;
  -webkit-mask:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg>') center/contain no-repeat;
  mask:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg>') center/contain no-repeat}
.side.a ul.ck li::before{background:var(--s1)}.side.b ul.ck li::before{background:var(--sx)}
.call{display:flex;gap:12px;padding:14px 16px;border-radius:14px;margin-top:14px;font-size:15px;border:1px dashed}
.call .ci{font-size:20px;line-height:1.3;flex:none}
.call.tip{background:color-mix(in srgb,var(--accent) 12%,transparent);border-color:color-mix(in srgb,var(--accent) 55%,transparent)}
.call.warn{background:var(--bad-bg);border-color:color-mix(in srgb,var(--bad) 45%,transparent)}
.call.mem{background:color-mix(in srgb,var(--brand2) 9%,transparent);border-color:color-mix(in srgb,var(--brand2) 45%,transparent)}
.call b{font-weight:800}
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;counter-reset:s}
@media (max-width:860px){.steps{grid-template-columns:repeat(2,1fr)}}
.step{background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:14px;position:relative}
.step::before{counter-increment:s;content:counter(s);display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--c);color:#fff;font-weight:800;font-size:13px;margin-bottom:8px}
[data-theme="dark"] .step::before{color:#0b0d1a}
.step b{display:block;font-size:14px;line-height:1.35}
.step b .en{color:var(--c)}
.step span{display:block;font-size:13px;color:var(--ink2);margin-top:4px;line-height:1.5}
.flow{display:flex;align-items:stretch;gap:8px;flex-wrap:wrap}
.flow .fx{flex:1;min-width:140px;background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:center}
.flow .fx b{display:block}
.flow .fx small{color:var(--ink2);font-size:13px}
.flow .ar{align-self:center;color:var(--muted);font-weight:800}
html[dir="rtl"] .flow .ar{transform:scaleX(-1)}
table.cmp{width:100%;border-collapse:separate;border-spacing:0;font-size:14.5px;border:1px solid var(--line);border-radius:14px;overflow:hidden}
table.cmp th,table.cmp td{padding:12px 14px;text-align:start;vertical-align:top;border-bottom:1px solid var(--line)}
table.cmp tr:last-child td{border-bottom:0}
table.cmp thead th{background:var(--surface2);font-size:14px}
table.cmp td:first-child{font-weight:800;white-space:nowrap;color:var(--ink2)}
table.cmp .fs{color:var(--s1)}table.cmp .bp{color:var(--sx)}
.tblwrap{overflow-x:auto}
.mnemo{display:flex;gap:8px;flex-wrap:wrap;direction:ltr;justify-content:center;margin:6px 0 4px}
.mnemo span{display:grid;place-items:center;min-width:54px;height:54px;padding:0 10px;border-radius:14px;background:var(--c);color:#fff;font-weight:800;font-size:24px;box-shadow:0 8px 18px -10px var(--c)}
[data-theme="dark"] .mnemo span{color:#0b0d1a}
.mnemo span small{font-size:10px;font-weight:700;display:block;line-height:1;margin-top:-6px;opacity:.9}
.lights .tile{border-width:2px}
.light-w{--c:#9aa3b5}.light-g{--c:#e0a100}.light-b{--c:#d63a4a}
.lights .tile h4{color:var(--c)}
.recap{background:linear-gradient(135deg,color-mix(in srgb,var(--c) 14%,var(--surface)),var(--surface));border:1.5px solid color-mix(in srgb,var(--c) 35%,var(--line))}
.recap ol{margin:0;padding-inline-start:20px}
.recap li{margin:6px 0}
.cta{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;padding:22px 26px;border-radius:22px;background:var(--ink);color:var(--bg);margin-top:10px}
.cta h3{margin:0;font-size:20px}
.cta p{margin:2px 0 0;opacity:.75;font-size:14px}
.cta .btn.pri{background:var(--accent);color:#16182b}
.money{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
@media (max-width:640px){.money{grid-template-columns:1fr}}
.money div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.money b{display:block;font-size:20px;color:var(--c);direction:ltr}
.money small{color:var(--muted);font-weight:700;font-size:12px}

/* ===== Quiz ===== */
.qz{display:grid;grid-template-columns:1fr 290px;gap:18px;padding:6px 0 60px;align-items:start}
@media (max-width:960px){.qz{grid-template-columns:1fr}}
.qbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.filters{display:inline-flex;gap:4px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.filters button{padding:7px 12px;border-radius:9px;font-weight:800;font-size:13px;color:var(--ink2)}
.filters button.on{background:var(--ink);color:var(--bg)}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:28px;box-shadow:var(--shadow-lg);position:relative;overflow:hidden}
.qcard .meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.qno{font-weight:800;font-size:14px;color:var(--muted)}
.qno b{color:var(--ink);font-size:18px}
.badge{font-size:12px;font-weight:800;padding:4px 10px;border-radius:999px;background:color-mix(in srgb,var(--c) 13%,transparent);color:var(--c)}
.badge.gray{background:var(--surface2);color:var(--ink2);border:1px solid var(--line)}
.qtext{font-size:21px;font-weight:700;line-height:1.55;margin:0 0 22px;direction:ltr;text-align:left;font-family:"Plus Jakarta Sans","Cairo",sans-serif}
.opts2{display:grid;gap:10px}
.opts2.tf{grid-template-columns:1fr 1fr}
.opt{display:flex;align-items:center;gap:14px;width:100%;padding:15px 16px;border-radius:15px;border:1.5px solid var(--line);background:var(--surface2);
  text-align:left;direction:ltr;font-size:16px;font-weight:600;transition:transform .15s,border-color .2s,background .2s;font-family:"Plus Jakarta Sans","Cairo",sans-serif}
.opt:hover:not(:disabled){border-color:var(--c);transform:translateY(-1px)}
.opt .L{flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-weight:800;font-size:14px;background:var(--surface);border:1px solid var(--line);color:var(--ink2)}
.opt .tx{flex:1}
.opt .ar-t{font-family:"Cairo",sans-serif;font-size:13px;color:var(--muted);font-weight:700;margin-inline-start:6px}
.opts2.tf .opt{justify-content:center;padding:20px;font-size:18px;font-weight:800}
.opts2.tf .opt .L{display:none}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}
.opt.ok .L{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.bad{border-color:var(--bad);background:var(--bad-bg);animation:shake .4s}
.opt.bad .L{background:var(--bad);color:#fff;border-color:var(--bad)}
.opt.dim{opacity:.5}
.opt .mk{flex:none;font-weight:800;font-size:18px}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.fb{margin-top:18px;border-radius:16px;padding:16px 18px;display:flex;gap:14px;align-items:flex-start;animation:pop .35s cubic-bezier(.2,.9,.3,1.3)}
.fb.ok{background:var(--ok-bg);border:1px solid color-mix(in srgb,var(--ok) 40%,transparent)}
.fb.bad{background:var(--bad-bg);border:1px solid color-mix(in srgb,var(--bad) 40%,transparent)}
.fb .ico{flex:none;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:20px}
.fb.ok .ico{background:var(--ok)}.fb.bad .ico{background:var(--bad)}
.fb h4{margin:0 0 2px;font-size:17px}
.fb.ok h4{color:var(--ok)}.fb.bad h4{color:var(--bad)}
.fb p{margin:0;font-size:15px;color:var(--ink)}
.fb .right{direction:ltr;unicode-bidi:isolate;font-weight:800}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
.qnav{display:flex;justify-content:space-between;align-items:center;margin-top:22px;gap:10px}
.kbd{font-size:12px;color:var(--muted);font-weight:600}
.kbd kbd{font-family:inherit;font-size:11px;font-weight:800;padding:2px 6px;border-radius:6px;border:1px solid var(--line2);background:var(--surface2);margin:0 2px}
@media (max-width:640px){.kbd{display:none}.qcard{padding:20px}.qtext{font-size:18px}}
.side-p{position:sticky;top:84px;display:grid;gap:14px}
.pbox{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:var(--shadow)}
.pbox h4{margin:0 0 12px;font-size:14px;color:var(--ink2);display:flex;justify-content:space-between}
.score3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.score3 div{border-radius:12px;padding:8px 4px;background:var(--surface2);border:1px solid var(--line)}
.score3 b{display:block;font-size:22px;line-height:1.2}
.score3 small{font-size:11px;font-weight:800;color:var(--muted)}
.score3 .o b{color:var(--ok)}.score3 .x b{color:var(--bad)}
.dots{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;max-height:300px;overflow:auto;padding:2px}
.dot{aspect-ratio:1;border-radius:9px;font-size:12px;font-weight:800;display:grid;place-items:center;background:var(--surface2);border:1px solid var(--line);color:var(--ink2);transition:.15s}
.dot:hover{border-color:var(--c)}
.dot.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.dot.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.dot.cur{outline:2.5px solid var(--c);outline-offset:2px}
.legend{display:flex;gap:12px;font-size:12px;color:var(--muted);font-weight:700;margin-top:10px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:5px;vertical-align:middle}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px;font-weight:700;color:var(--ink2);padding:6px 0}
.sw{width:42px;height:24px;border-radius:99px;background:var(--line2);position:relative;transition:.2s;flex:none}
.sw::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw.on{background:var(--c)}
.sw.on::after{inset-inline-start:21px}
.topprog{height:6px;background:var(--surface2);border-radius:99px;overflow:hidden;margin-bottom:14px}
.topprog i{display:block;height:100%;background:var(--c);transition:width .4s}

/* result */
.result{background:var(--surface);border:1px solid var(--line);border-radius:26px;padding:34px;box-shadow:var(--shadow-lg);text-align:center}
.ring{width:190px;height:190px;margin:0 auto 18px;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:grid;place-items:center;align-content:center}
.ring .v b{font-size:46px;line-height:1;font-weight:800}
.ring .v small{color:var(--muted);font-weight:700;font-size:13px}
.result h2{margin:0 0 4px;font-size:28px}
.result p{color:var(--ink2);margin:0 0 20px}
.result .row{justify-content:center}
.review{margin-top:26px;text-align:start}
.review h3{font-size:18px;margin:0 0 10px}
.rv{border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px;background:var(--surface2)}
.rv .qq{direction:ltr;text-align:left;font-weight:700;margin-bottom:6px}
.rv .aa{font-size:14px;direction:ltr;text-align:left}
.rv .aa .y{color:var(--bad);font-weight:800}.rv .aa .c{color:var(--ok);font-weight:800}
.rv .ee{font-size:14px;color:var(--ink2);margin-top:6px}

.confetti{position:fixed;inset:0;pointer-events:none;z-index:100;overflow:hidden}
.confetti i{position:absolute;width:9px;height:14px;top:-20px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;font-weight:700;font-size:14px;z-index:90;animation:pop .3s}

footer{padding:30px 0 40px;text-align:center;color:var(--muted);font-size:13px;border-top:1px solid var(--line);margin-top:20px}
.fade{animation:fadeIn .35s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

ul.ck.no li::before{background:var(--bad);-webkit-mask:none;mask:none;content:"✕";color:var(--bad);background:none;font-size:13px;font-weight:800;top:.1em;width:auto;height:auto}

</style>

MC("The Washington State feasibility study involved:",["Electric cars","High-speed rail","Airport expansion","Housing projects"],1,
 "مثال واشنطن = قطار سريع (Vancouver–Seattle–Portland).","High-speed rail."),
MC("Operational feasibility assesses:",["Financial statements","Organizational capacity and structure","Legal documents","Environmental reports"],1,
 "Operational = قدرة وهيكل المنظمة على التشغيل.","Organizational capacity & structure."),
MC("In the Washington high-speed rail feasibility study, the project’s main goal was to:",["Build new airports","Improve regional transportation and economic growth","Develop new software","Increase fuel consumption"],1,
 "تحسين المواصلات في المنطقة والنمو الاقتصادي.","Regional transport & economic growth."),
MC("The conclusion section provides:",["Raw data","Recommendations and summaries","Budget requests","Advertisements"],1,
 "القسم الختامي = استنتاجات وتوصيات.","Recommendations & summaries."),
MC("Which of the following is NOT a key reason for conducting a feasibility study?",["Risk Mitigation","Informed Decision-Making","Resource Optimization","Product Advertising"],3,
 "الإعلان عن المنتج مش من الأسباب التسعة.","Advertising is not one of the 9 reasons."),
MC("Which section of a feasibility study analyzes demand, competition, and market trends?",["Technical Feasibility","Market Feasibility","Legal Feasibility","Financial Feasibility"],1,
 "طلب + منافسين + اتجاهات = Market.","Market feasibility."),
MC("The main objective of a feasibility study is to:",["Develop a marketing campaign","Determine whether a project will likely succeed","Replace a business plan","Manage daily operations"],1,
 "نعرف هل المشروع غالبًا هينجح.","Will the project likely succeed?"),
MC("Which of the following statements best describes a business plan?",["A document that determines if a project is possible","A detailed roadmap for how to execute an approved idea","A simple summary of feasibility","A list of investor names"],1,
 "Business plan = خريطة طريق تفصيلية لتنفيذ فكرة اتوافق عليها.","A detailed roadmap to execute an approved idea."),
MC("When do investors most commonly require a feasibility study?",["After the project has started","Before committing financial resources","After hiring staff","During marketing campaigns"],1,
 "قبل ما يحطوا فلوسهم.","Before committing money."),
MC("Technical feasibility focuses primarily on:",["Funding sources","Technology and resource capability","Market competitors","Social benefits"],1,
 "Technical = التكنولوجيا والموارد.","Technology & resources."),
MC("Which of the following is included in the concluding section of a feasibility study?",["Market research","Executive summary","Conclusions and recommendations","Risk analysis"],2,
 "الختامي = Conclusions + Recommendations + Appendices.","Conclusions & recommendations."),
MC("A feasibility study can help attract investors because:",["It hides financial risks","It provides data proving project potential","It guarantees profit","It replaces funding contracts"],1,
 "بتقدم بيانات بتثبت إن المشروع له مستقبل.","It provides data proving potential."),
MC("Which of the following types of feasibility includes compliance and environmental factors?",["Operational Feasibility","Legal and Environmental Feasibility","Market Feasibility","Technical Feasibility"],1,
 "امتثال + بيئة = Legal & Environmental.","Legal & Environmental."),
],

/* ======================= SECTION 4 ======================= */
s4:[
MC("What is the primary purpose of conducting a market trend analysis?",["To determine the company’s internal financial structure.","To identify patterns in consumer behavior and anticipate future market changes.","To calculate the organization’s total operating expenses.","To evaluate employee productivity."],1,
 "تحليل الاتجاهات = نكتشف أنماط سلوك المستهلك ونتوقع التغيرات الجاية.","Spot consumer patterns & anticipate change."),
MC("Which of the following represents a technological factor affecting market trends?",["Changes in consumer income.","Shifts in cultural values.","The emergence of artificial intelligence and automation.","Changes in government taxation policies."],2,
 "AI والأتمتة = عامل تكنولوجي. (الدخل = اقتصادي، القيم = اجتماعي، الضرايب = سياسي)","AI & automation = technological."),
MC("Which of the following is considered a key component of market analysis?",["Employee motivation.","Customer segmentation.","Organizational hierarchy.","Internal communication."],1,
 "تقسيم العملاء من المكونات الأربعة للتحليل.","Customer segmentation is one of the 4 components."),
MC("What does market segmentation primarily involve?",["Dividing competitors according to their financial performance.","Classifying customers based on demographics, interests, and behaviors.","Dividing organizational resources among departments.","Classifying products according to production costs."],1,
 "تقسيم العملاء حسب الديموجرافيا والاهتمامات والسلوك.","Classifying customers by demographics, interests, behaviors."),
MC("Which of the following is an example of an economic barrier to market entry?",["Obtaining a required operating license.","Changes in consumer preferences.","High initial capital investment.","The emergence of new technologies."],2,
 "رأس مال كبير = عائق اقتصادي. (الترخيص = عائق تنظيمي Regulatory)","High capital = economic barrier."),
MC("When market demand exceeds market supply, the situation generally indicates:",["A potential opportunity for new products or market entrants.","A complete absence of market competition.","A decline in consumer purchasing power.","An immediate reduction in market opportunities."],0,
 "Demand > Supply = فرصة.","Demand > Supply = opportunity."),
MC("Which of the following is the most appropriate method for identifying and monitoring emerging market trends?",["Depending exclusively on managerial intuition.","Ignoring historical consumer behavior.","Monitoring Google Trends and industry newsletters.","Focusing only on internal organizational reports."],2,
 "أدوات المتابعة: Google Trends ونشرات الصناعة.","Google Trends & industry newsletters."),
MC("In developing a sales forecast, businesses should primarily consider:",["Historical sales data and external market influences.","Employee attendance and organizational structure.","Internal communication and leadership styles.","Production facilities without considering market demand."],0,
 "التوقع = بيانات المبيعات القديمة + تأثيرات السوق الخارجية.","Historical data + external influences."),
MC("Which of the following best describes competitive analysis?",["Evaluating employees’ individual performance.","Identifying competitors’ strategies, strengths, weaknesses, and market positioning.","Measuring the organization’s internal administrative efficiency.","Estimating the company’s annual tax obligations."],1,
 "تحليل المنافسين: استراتيجياتهم + قوتهم + ضعفهم + مكانتهم.","Competitors' strategies, strengths, weaknesses, positioning."),
MC("Within the PEST framework, changes in consumer spending and inflation are classified as:",["Political factors.","Social factors.","Economic factors.","Technological factors."],2,
 "تضخم وإنفاق = E = Economic.","Inflation & spending = Economic."),
MC("A company observes that consumer purchasing preferences have changed significantly due to new cultural values. Which analytical approach would be most appropriate?",["Analyzing social factors within the PEST framework.","Evaluating internal production efficiency.","Analyzing organizational hierarchy.","Assessing employee compensation policies."],0,
 "قيم ثقافية = S = Social في PEST.","Cultural values = Social."),
MC("A new business intends to enter a market dominated by well-established companies with strong customer loyalty. What would be the most appropriate strategic response?",["Compete directly without conducting further analysis.","Focus on an underserved market niche to build customer loyalty.","Ignore existing competitors and their market positions.","Increase initial investment without evaluating potential risks."],1,
 "لو السوق مقفول على الكبار → دوّر على شريحة مهملة (Niche).","Target an underserved niche."),
MC("Why is collecting consistent consumer data over time essential for effective market trend analysis?",["It eliminates the need for market segmentation.","It enables businesses to identify changes and measure how quickly trends evolve.","It guarantees that all identified trends will continue indefinitely.","It replaces the need for competitive analysis."],1,
 "البيانات على فترة بتوضح التغيير وسرعته.","Shows change and its speed."),
MC("A business identifies a sudden increase in demand for a specific product following a social media post. What should the business examine before classifying this change as a market trend?",["Whether the change is recurring and reflects broader market developments.","Whether the post received a large number of comments only.","Whether competitors have stopped their operations.","Whether the company can immediately increase its prices."],0,
 "قبل ما تقول ترند: اتأكد إنه متكرر ومش حدث مرة واحدة.","Check if it's recurring, not one-time."),
MC("Why should a business develop optimistic, realistic, and conservative sales forecasting scenarios?",["To eliminate uncertainty from the business environment.","To prepare for different possible market conditions and demand outcomes.","To ensure that actual sales will match projected sales.","To avoid collecting historical sales information."],1,
 "الـ 3 سيناريوهات عشان تبقى جاهز لأي ظرف — مش بتلغي عدم اليقين.","To prepare for different conditions."),
MC("A company compares consumer behavior across different geographical markets to determine whether an emerging trend is global, regional, or local. This process is known as:",["Internal resource allocation.","Cross-market comparison.","Operational cost analysis.","Organizational benchmarking."],1,
 "مقارنة الأسواق = Cross-market comparison.","Cross-market comparison."),
MC("Which of the following best explains the relationship between customer segmentation and purchasing patterns?",["Segmentation enables businesses to understand different customer groups and tailor their marketing approaches accordingly.","Segmentation eliminates differences in consumer purchasing decisions.","Purchasing patterns are independent of customer characteristics.","Segmentation is primarily concerned with identifying competitors’ weaknesses."],0,
 "التقسيم بيخليك تفهم كل مجموعة وتفصّل التسويق ليها.","Understand groups → tailor marketing."),
MC("A company discovers that its market is experiencing oversupply. At the same time, several competitors offer similar products. Based on market analysis principles, which strategy would be most appropriate?",["Enter the market without developing a differentiation strategy.","Focus on differentiation to establish a distinctive competitive position.","Ignore competitors’ strengths and weaknesses.","Discontinue all market research activities."],1,
 "عرض كتير + منتجات شبه بعض → لازم تتميز (Differentiation).","Oversupply → differentiate."),
MC("A business identifies a new technological innovation that may significantly change consumer purchasing behavior. However, the available evidence is based on a single short-term observation. What is the most academically appropriate decision?",["Immediately redesign the entire business strategy.","Reject the observation because technological changes are unpredictable.","Collect reliable data over time and examine the broader context before making strategic decisions.","Assume that the observed change represents a permanent market trend."],2,
 "ملاحظة واحدة قصيرة مش كفاية → اجمع بيانات أكتر وافهم السياق.","Collect more data & context first."),
MC("A company is conducting a comprehensive market analysis before entering a new industry. It identifies regulatory restrictions, high capital requirements, strong competitors, and changing consumer preferences. Which approach would provide the most comprehensive basis for its entry decision?",["Evaluating only the financial resources required for entry.","Examining market trends, external factors, competitive conditions, and barriers to entry collectively.","Focusing exclusively on potential customer demand.","Relying primarily on the company’s previous operational experience."],1,
 "الكلمة السحرية: comprehensive → ادرس كل حاجة مع بعض.","Comprehensive = examine everything together."),
TF("Market trend analysis focuses on identifying patterns in consumer behavior and anticipating future market changes.",true,
 "صح — ده تعريفها.","That's its definition."),
TF("Demographic segmentation is concerned exclusively with analyzing competitors’ financial performance.",false,
 "غلط — Demographic = تقسيم العملاء (سن، نوع، دخل...) مش المنافسين.","Demographic = customer traits, not competitors."),
TF("Technological innovations can influence market conditions and create new business opportunities.",true,
 "صح.","Correct."),
TF("Demand exceeding supply may indicate an opportunity for new market entrants.",true,
 "صح — Demand > Supply = فرصة.","Demand > Supply = opportunity."),
TF("The PEST framework consists of Political, Economic, Social, and Technological factors.",true,
 "صح — P E S T.","P-E-S-T."),
TF("Historical sales data can be used as a foundation for developing sales forecasts.",true,
 "صح.","Correct."),
TF("Market trend analysis should rely primarily on managerial intuition rather than reliable consumer data.",false,
 "غلط — لازم بيانات موثوقة مش إحساس المدير.","Rely on data, not intuition."),
TF("Regulatory requirements, such as licenses and certifications, may represent barriers to entry.",true,
 "صح — ده العائق التنظيمي (Regulatory).","Regulatory barrier."),
TF("Competitive analysis is limited to identifying competitors’ strengths without examining their weaknesses.",false,
 "غلط — بتدرس القوة والضعف والاستراتيجيات والمكانة.","Strengths AND weaknesses."),
TF("Economic conditions, including inflation and changes in consumer spending, may affect market demand.",true,
 "صح.","Correct."),
TF("Cross-market comparisons help businesses determine whether a particular trend is global, regional, or specific to a local market.",true,
 "صح.","Correct."),
TF("A sudden increase in consumer interest always indicates the existence of a sustainable long-term market trend.",false,
 "غلط — كلمة always فخ! الزيادة المفاجئة ممكن تكون حدث مرة واحدة.","'Always' is the trap — could be one-time."),
TF("Businesses should consider seasonality, economic conditions, and competitive activity when developing sales forecasts.",true,
 "صح.","Correct."),
TF("Strong customer loyalty among established competitors may create difficulties for new businesses attempting to enter the market.",true,
 "صح — ده عائق تنافسي (Competitive barrier).","Competitive barrier."),
TF("Demographic and psychographic segmentation can help businesses understand who drives a market trend and why.",true,
 "صح — Demographic = مين؟ / Psychographic = ليه؟","Who (demographic) & why (psychographic)."),
TF("When analyzing market trends, businesses should consider whether an observed change is recurring or merely a one-time occurrence.",true,
 "صح.","Correct."),
TF("An oversupply situation generally reduces the importance of product differentiation because customers have fewer alternatives.",false,
 "غلط — العكس! في الـ oversupply العميل عنده بدائل أكتر، فالتميز أهم.","Opposite: more alternatives → differentiation matters more."),
],

/* ======================= SECTION 5 ======================= */
s5:[
MC("A startup chooses to operate as a sole proprietorship because the owner wants complete control over decisions. However, the owner ignores the possibility of personal liability. Which aspect of legal feasibility has been overlooked?",["Intellectual property protection","Legal structure implications","Environmental impact assessment","Stakeholder communication"],1,
 "الملكية الفردية = مسؤولية شخصية غير محدودة → ده من آثار الشكل القانوني.","Sole proprietorship = unlimited liability → legal structure."),
MC("A company signs a contract with a supplier without clearly defining delivery deadlines or penalties. Later, a disagreement occurs. What does this situation mainly demonstrate?",["The importance of environmental regulations","The role of contracts in reducing legal risks","The importance of choosing a joint-stock company","The relationship between projects and the environment"],1,
 "العقود الواضحة بتقلل المخاطر والخلافات.","Clear contracts reduce legal risk."),
MC("A business discovers that another company is using its registered brand name. Which legal feasibility element is most directly involved?",["Labor regulations","Investment regulations","Intellectual property protection","Environmental compliance"],2,
 "اسم البراند = ملكية فكرية.","Brand name = intellectual property."),
MC("A project is financially attractive, but its required licenses cannot be obtained under existing regulations. What should the feasibility study conclude?",["The project is automatically feasible because it is profitable","Legal feasibility may prevent the project from proceeding","The company should ignore licensing requirements","Environmental assessment can replace legal approval"],1,
 "مربح بس مفيش ترخيص → ممكن يتوقف قانونيًا.","Profitable but unlicensable → legally blocked."),
MC("Two entrepreneurs want to establish a business together but also want to limit their personal liability. Which consideration should receive the greatest attention?",["Selecting an appropriate legal structure","Reducing the project's environmental impact only","Increasing the number of employees","Expanding the project's geographical area"],0,
 "تحديد المسؤولية = اختيار الشكل القانوني المناسب.","Limit liability → choose legal structure."),
MC("A factory has limited environmental effects during construction but produces significant pollution during operation. Which conclusion is most appropriate?",["Environmental assessment should focus only on construction","Environmental impacts should be assessed throughout different project stages","The project belongs automatically to the White List","Operational impacts are not relevant to feasibility"],1,
 "التقييم في كل المراحل: قبل وأثناء وبعد.","Assess all stages."),
MC("A project creates pollution that affects not only the surrounding community but also neighboring regions. Which dimension of environmental assessment is demonstrated?",["Temporal dimension","Spatial dimension","Legal structure dimension","Financial dimension"],1,
 "مكان/مناطق = Spatial (مكاني). زمن = Temporal.","Place/regions = spatial."),
MC("A proposed project has negative environmental impacts, but these impacts can be reduced through expensive technologies and substantial investment. According to the chapter, how should this project be classified?",["White List","Gray List","Black List","Not subject to environmental assessment"],1,
 "ضرر ينفع يتقلل بس بتكلفة عالية = Gray List.","Mitigable at high cost = Gray."),
MC("A project causes serious environmental damage that cannot be avoided or adequately mitigated. What is the most likely classification?",["White List","Gray List","Black List","Limited partnership"],2,
 "ضرر خطير مش ممكن يتعالج = Black List.","Unavoidable severe damage = Black."),
MC("A company studies environmental impacts only after the project starts operating. What is the main weakness of this approach?",["It ignores the importance of early planning and assessment","It gives too much attention to legal contracts","It focuses excessively on intellectual property","It automatically increases stakeholder trust"],0,
 "اتأخرت! لازم التقييم يبدأ من التخطيط.","It skips early planning."),
TF("A project may be financially profitable but legally infeasible if it cannot comply with the required laws and regulations.",true,
 "صح — الربح لوحده مش كفاية.","Profit alone isn't enough."),
TF("Choosing a legal structure is only an administrative decision and has no effect on the owner's liability or business operations.",false,
 "غلط — الشكل القانوني بيأثر على مسؤولية المالك وتشغيل البزنس.","It affects liability and operations."),
TF("Contracts help businesses clarify responsibilities and reduce the possibility of disputes between parties.",true,
 "صح.","Correct."),
TF("Intellectual property protection is relevant only to large corporations and is unnecessary for small businesses.",false,
 "غلط — مهمة للصغير والكبير.","Important for small and large businesses."),
TF("Environmental feasibility considers the relationship between the project and its surrounding environment, including how each affects the other.",true,
 "صح — العلاقة في الاتجاهين.","Two-way relationship."),
TF("Environmental impact assessment should consider the project's effects only within the exact location where it is established.",false,
 "غلط — لازم مستويات مختلفة: محلي، مجاور، إقليمي، عالمي.","Local, neighboring, regional, global."),
TF("The temporal dimension of environmental assessment means examining environmental impacts at different stages of the project's life.",true,
 "صح — Temporal = زمني.","Temporal = time."),
TF("Projects classified under the White List generally have minimal environmental impacts and may not require detailed environmental studies.",true,
 "صح — White = تأثير بسيط.","White = minimal impact."),
TF("A project classified under the Gray List has environmental impacts that are impossible to mitigate under any circumstances.",false,
 "غلط — ده وصف الـ Black. الـ Gray ممكن يتعالج بس بتكلفة عالية.","That's Black; Gray is mitigable at high cost."),
TF("A project classified under the Black List may face rejection because its environmental damage cannot be adequately avoided or mitigated.",true,
 "صح — Black = ممكن يترفض.","Black = may be rejected."),
],
};

const SECTIONS = [
{ id:'s1', n:'01', c:'var(--s1)',
  title:{ar:'دراسة الجدوى ودراسة الظهور', en:'Feasibility vs. Visibility'},
  desc:{ar:'الفرق بين Feasibility و Visibility، خطوات دراسة الظهور العشرة، وأنواع الجدوى.', en:'Feasibility vs visibility, the 10 steps of a visibility study, and feasibility types.'},
  topics:['Feasibility','Visibility','SWOT','10 Steps','TELOS'],
  lesson:(L)=>`
  <div class="blk"><h2><span class="n">1</span>${L('أهم فرق في السكشن كله','The #1 distinction in this section')}</h2>
   <p class="sub">${L('الاتنين اسمهم شبه بعض، بس معناهم مختلف تمامًا — وأسئلة كتير بتلعب على الحتة دي.','The names sound alike but mean totally different things — many questions test this.')}</p>
   <div class="vsbox">
    <div class="side a"><h3 class="en">Feasibility Study</h3><div class="q">${L('دراسة الجدوى: هل المشروع ينفع يتعمل؟','"Can this project be done?"')}</div>
     <ul class="ck">
      <li>${L('بتفحص المشروع من <b>كل النواحي</b> (all relevant areas)','Examines the project in <b>all relevant areas</b>')}</li>
      <li>${L('بتتوقع هل المشروع هيتنفذ كله بنجاح — أو <b>نعدّله</b> عشان ينفع','Predicts if it can be fully realized — or <b>modifies</b> it so it can')}</li>
      <li>${L('بتتعمل <b>قبل</b> ما نبدأ المشروع','Done <b>before</b> starting the project')}</li>
      <li>${L('لأي مشروع: <b>قومي</b> (دولة) أو <b>شركة</b>','For any project: <b>national</b> or <b>corporate</b>')}</li>
      <li>${L('أهميتها: <b>بتحدد نجاح أو فشل</b> المشروع','Why it matters: it <b>determines success or failure</b>')}</li>
     </ul></div>
    <div class="vs">VS</div>
    <div class="side b"><h3 class="en">Visibility Study</h3><div class="q">${L('دراسة الظهور: إحنا معروفين قد إيه؟','"How visible / known are we?"')}</div>
     <ul class="ck">
      <li>${L('Visibility = <b>القدرة إنك تشوف أو تتشاف</b>','Visibility = <b>ability to see or be seen</b>')}</li>
      <li>${L('بتقيس <b>وعي ومعرفة</b> الجمهور المستهدف بالشركة','Measures <b>awareness & recognition</b> in the target market')}</li>
      <li>${L('<b>Market visibility</b> = المنتج أو الخدمة معروفة قد إيه','<b>Market visibility</b> = how well-known a product/service is')}</li>
      <li>${L('وبتدوّر على <b>فرص للتحسين</b>','And finds <b>opportunities to improve</b>')}</li>
     </ul></div>
   </div>
   <div class="call warn"><span class="ci">⚠️</span><div>${L('<b>فخ الامتحان:</b> ناس كتير بتقول visibility وهي تقصد feasibility. لو السؤال بيتكلم عن <b>التكاليف</b> أو <b>هل المشروع ممكن يتنفذ</b> → دي <b>Feasibility</b> مش Visibility.','<b>Exam trap:</b> people often say visibility when they mean feasibility. If a question mentions <b>costs</b> or <b>whether the project can be implemented</b> → that\'s <b>Feasibility</b>, not visibility.')}</div></div>
  </div>

  <div class="blk"><h2><span class="n">2</span>${L('الـ Visibility Study بتفيد في إيه؟','What does a visibility study give you?')}</h2>
   <p class="sub">${L('6 فوايد — احفظهم، أغلب أسئلة صح وغلط جاية منهم.','6 benefits — most T/F questions come from these.')}</p>
   <div class="g3">
    <div class="tile"><div class="ic">💪</div><h4><span class="en">Identify strengths & weaknesses</span></h4><p>${L('تعرف إنت قوي فين وضعيف فين','Know where you are strong or weak')}</p></div>
    <div class="tile"><div class="ic">🎯</div><h4><span class="en">Understand the target market</span></h4><p>${L('تفهم جمهورك المستهدف','Understand your audience')}</p></div>
    <div class="tile"><div class="ic">🏁</div><h4><span class="en">Stay ahead of competitors</span></h4><p>${L('تفضل سابق المنافسين','Stay ahead of rivals')}</p></div>
    <div class="tile"><div class="ic">📣</div><h4><span class="en">Optimize marketing efforts</span></h4><p>${L('تحسّن التسويق — يعني ليها تأثير على استراتيجيات التسويق','Improve marketing — it affects marketing strategy')}</p></div>
    <div class="tile"><div class="ic">✨</div><h4><span class="en">Enhance brand perception</span></h4><p>${L('صورة البراند عند الناس تبقى أحسن','Better brand image')}</p></div>
    <div class="tile"><div class="ic">💬</div><h4><span class="en">Increase customer engagement</span></h4><p>${L('تفاعل العملاء يزيد','More customer engagement')}</p></div>
   </div>
   <div class="call tip"><span class="ci">💡</span><div>${L('وكمان: بتساعد في <b>توجيه اتخاذ القرار</b> (Guiding decision-making) وبتبني <b>أساس قوي للنمو</b> (Strong foundation for growth).','Also: it <b>guides decision-making</b> and builds a <b>strong foundation for growth</b>.')}</div></div>
  </div>

  <div class="blk"><h2><span class="n">3</span>${L('الأدوات اللي بنستخدمها','Tools used in the study')}</h2>
   <div class="g2">
    <div class="tile hl"><h4><span class="en">SWOT Analysis</span></h4>
     <div class="mnemo"><span>S<small>Strength</small></span><span>W<small>Weakness</small></span><span>O<small>Opportunity</small></span><span>T<small>Threat</small></span></div>
     <p>${L('<b>S و W داخليين</b> (جوه الشركة) — <b>O و T خارجيين</b> (في السوق).','<b>S & W are internal</b> — <b>O & T are external</b>.')}</p></div>
    <div class="tile"><h4><span class="en">Competitor Analysis</span></h4><p>${L('مش عشان تقلّد المنافسين! عشان تلاقي <b>الفجوات والفرص</b> في السوق (market gaps & opportunities).','Not to copy rivals — to find <b>market gaps & opportunities</b>.')}</p></div>
    <div class="tile"><h4>🌐 <span class="en">Online visibility</span></h4><p>${L('تقييم <b>الموقع والسوشيال ميديا</b>.','Evaluate <b>website & social media</b>.')}</p></div>
    <div class="tile"><h4>📰 <span class="en">Offline visibility</span></h4><p>${L('<b>الإعلانات التقليدية والعلاقات العامة (PR)</b>.','<b>Traditional advertising & PR</b>.')}</p></div>
   </div>
   <div class="call mem"><span class="ci">🔎</span><div>${L('<b>Data analysis & reporting</b> = بيطلّع الاتجاهات (trends) والأفكار (insights) من البيانات اللي جمعناها. و<b>تقييم التسويق الحالي</b> جزء ضروري من الدراسة.','<b>Data analysis & reporting</b> reveals trends & insights. <b>Evaluating current marketing</b> is a necessary part of the study.')}</div></div>

    <div class="step"><b><span class="en">Key Metrics & Indicators</span></b><span>${L('مقاييس عشان تقيس بدقة','To measure accurately')}</span></div>

   </div>
  </div>

    </ul></div>
    <div class="tile"><h4 style="color:var(--bad)">✘ ${L('غلط','Don\'t')}</h4><ul class="ck no">

    <div class="tile"><div class="ic">🚪</div><h4>${L('هل فيه فرصة في السوق؟','Is there an opportunity?')}</h4></div>
   </div>
   <div class="call tip"><span class="ci">☕</span><div>${L('<b>مثال:</b> عايز تفتح كافيه؟ أول حاجة تدرسها مش الديكور — تدرس السوق: مين هيشتري، مين حواليك، والناس محتاجة إيه.','<b>Example:</b> opening a coffee shop? First study the market, not the décor.')}</div></div>
  </div>

  <div class="blk"><h2><span class="n">2</span>${L('تحليل اتجاهات السوق','Market trends analysis')}</h2>
   <p class="sub">${L('هدفه: نكتشف <b>أنماط سلوك المستهلك</b> ونتوقع <b>التغييرات الجاية</b>.','Goal: identify <b>consumer behavior patterns</b> and <b>anticipate future changes</b>.')}</p>
   <div class="g4">
    <div class="tile"><div class="ic">🛒</div><h4><span class="en">Consumer Behavior</span></h4><p>${L('عادات الشرا والتفضيلات','Buying habits & preferences')}</p></div>
    <div class="tile"><div class="ic">🤖</div><h4><span class="en">Technological</span></h4><p>${L('AI، أتمتة، منصات رقمية','AI, automation, digital platforms')}</p></div>
    <div class="tile"><div class="ic">📈</div><h4><span class="en">Economic</span></h4><p>${L('تضخم، دخل، طلب','Inflation, income, demand')}</p></div>
    <div class="tile"><div class="ic">🎭</div><h4><span class="en">Social & Cultural</span></h4><p>${L('أسلوب الحياة والقيم','Lifestyle & values')}</p></div>
   </div>
   <h3 style="margin:22px 0 10px;font-size:17px">${L('إزاي تحلل ترند؟ (5 خطوات)','How to analyze a trend (5 steps)')}</h3>
   <div class="steps">
    <div class="step"><b><span class="en">Define goal</span></b><span>${L('حدد هدفك','Set the goal')}</span></div>
    <div class="step"><b><span class="en">Collect data over time</span></b><span>${L('بيانات على فترة طويلة — عشان تشوف التغيير وسرعته','Over time — to see change & speed')}</span></div>
    <div class="step"><b><span class="en">Segment customers</span></b><span>${L('قسّم العملاء','Split customers')}</span></div>
    <div class="step"><b><span class="en">Understand context</span></b><span>${L('افهم السياق','Read context')}</span></div>
    <div class="step"><b><span class="en">Insights → strategy</span></b><span>${L('حوّل النتايج لخطة','Turn into strategy')}</span></div>
   </div>
   <div class="call warn"><span class="ci">⚠️</span><div>${L('<b>مهم جدًا:</b> زيادة مفاجئة في الطلب (مثلًا بعد بوست على السوشيال) <b>مش دايمًا ترند</b>! اتأكد إنها <b>متكررة</b> مش حدث مرة واحدة. ولو عندك ملاحظة واحدة قصيرة → <b>اجمع بيانات أكتر</b> وافهم السياق قبل ما تغيّر استراتيجيتك. (أي سؤال فيه <b>always</b> هنا غالبًا غلط)','<b>Key:</b> a sudden spike is <b>not always a trend</b>. Check if it\'s <b>recurring</b>. With one short-term observation → <b>collect more data</b> first. ("always" here = usually False)')}</div></div>
   <div class="g2" style="margin-top:12px">
    <div class="tile"><h4>🔭 ${L('أدوات المتابعة','Monitoring tools')}</h4><p>${L('<b>Google Trends</b> و<b>النشرات المتخصصة</b> (industry newsletters) — مش إحساس المدير.','<b>Google Trends</b> & <b>industry newsletters</b> — not intuition.')}</p></div>
    <div class="tile"><h4>🌍 <span class="en">Cross-market comparison</span></h4><p>${L('تقارن سلوك العملاء في أسواق/أماكن مختلفة عشان تعرف الترند <b>عالمي ولا إقليمي ولا محلي</b>.','Compare markets to see if a trend is <b>global, regional or local</b>.')}</p></div>
   </div>
  </div>

  <div class="blk"><h2><span class="n">3</span>${L('المكونات الأربعة لتحليل السوق','4 key components of market analysis')}</h2>
   <div class="g2">
    <div class="tile"><h4>⚖️ <span class="en">Demand & Supply</span></h4><ul class="ck">
     <li>${L('<b>Demand &gt; Supply</b> = فرصة لمنتجات أو داخلين جداد 🟢','<b>Demand &gt; Supply</b> = opportunity 🟢')}</li>
     <li>${L('<b>Supply &gt; Demand</b> = منافسة أكتر (Oversupply) 🔴 → لازم <b>تتميز (Differentiation)</b> لأن العميل عنده بدائل كتير','<b>Supply &gt; Demand</b> = more competition 🔴 → <b>differentiate</b>')}</li></ul></div>
    <div class="tile"><h4>👥 <span class="en">Customer Segmentation</span></h4><p>${L('تقسيم <b>العملاء</b> حسب: الديموجرافيا، الاهتمامات، السلوك، وأنماط الشرا — عشان تفصّل التسويق لكل مجموعة.','Divide <b>customers</b> by demographics, interests, behaviors, purchasing patterns.')}</p>
     <p style="margin-top:6px">${L('<b>Demographic</b> = مين؟ — <b>Psychographic</b> = ليه؟','<b>Demographic</b> = who? — <b>Psychographic</b> = why?')}</p></div>
    <div class="tile"><h4>🥊 <span class="en">Competitive Landscape</span></h4><p>${L('ادرس المنافسين: <b>نقاط القوة + الضعف + الاستراتيجيات + مكانتهم في السوق</b> (مش القوة بس).','Study rivals\' <b>strengths, weaknesses, strategies, positioning</b>.')}</p></div>
    <div class="tile"><h4>🌐 <span class="en">External Factors (PEST)</span></h4><p>${L('العوامل الخارجية الأربعة — تحت بالتفصيل 👇','The 4 external factors — below 👇')}</p></div>
   </div>
  </div>

  <div class="blk"><h2><span class="n">4</span>${L('تحليل PEST','PEST analysis')}</h2>
   <div class="mnemo"><span>P</span><span>E</span><span>S</span><span>T</span></div>
   <div class="tblwrap" style="margin-top:14px"><table class="cmp"><thead><tr><th></th><th>${L('بيشمل إيه','Covers')}</th><th>${L('مثال','Example')}</th></tr></thead><tbody>
    <tr><td class="en">🏛️ Political</td><td>${L('قوانين الحكومة، السياسات، الاستقرار','Government regulations, policies, stability')}</td><td>${L('قوانين ضرايب جديدة','New tax laws')}</td></tr>
    <tr><td class="en">💰 Economic</td><td>${L('التضخم، الفايدة، إنفاق المستهلك','Inflation, interest rates, consumer spending')}</td><td>${L('ارتفاع الأسعار','Rising prices')}</td></tr>
    <tr><td class="en">👨‍👩‍👧 Social</td><td>${L('أسلوب الحياة، القيم، الثقافة','Lifestyle, values, culture')}</td><td>${L('ترند الصحة واللياقة','Health & wellness trends')}</td></tr>
    <tr><td class="en">⚙️ Technological</td><td>${L('الابتكار، الرقمنة، AI','Innovation, digitalization, AI')}</td><td>${L('الأتمتة','Automation')}</td></tr>
   </tbody></table></div>
   <div class="call mem"><span class="ci">🧠</span><div>${L('<b>تضخم/إنفاق</b> = Economic · <b>قيم ثقافية/نمط حياة</b> = Social · <b>AI/أتمتة</b> = Technological · <b>ضرايب/قوانين</b> = Political','<b>Inflation/spending</b> = E · <b>culture/lifestyle</b> = S · <b>AI</b> = T · <b>taxes/laws</b> = P')}</div></div>
  </div>

  <div class="blk"><h2><span class="n">5</span>${L('توقع المبيعات وعوائق الدخول','Sales forecasting & barriers to entry')}</h2>
   <div class="g2">
    <div class="tile"><h4>📊 <span class="en">Sales Forecasting</span></h4>
     <p>${L('تتوقع مبيعاتك باستخدام <b>بيانات المبيعات القديمة + تأثيرات السوق الخارجية</b>. خد في اعتبارك:','Estimate sales from <b>historical data + external market influences</b>. Consider:')}</p>
     <ul class="ck"><li class="en">Historical sales data</li><li class="en">Seasonality</li><li class="en">Economic conditions</li><li class="en">Competitive activity</li></ul>
     <p style="margin-top:8px">${L('اعمل <b>3 سيناريوهات</b>: <b>Optimistic</b> (متفائل) · <b>Realistic</b> (واقعي) · <b>Conservative</b> (متحفظ) — عشان <b>تستعد لكل الظروف</b> (مش عشان تلغي عدم اليقين).','Build <b>3 scenarios</b>: optimistic · realistic · conservative — to <b>prepare for different conditions</b>.')}</p></div>
    <div class="tile"><h4>🚧 <span class="en">Barriers to Entry</span></h4>
     <p>${L('حاجات بتصعّب دخول شركات جديدة للسوق:','Obstacles for new entrants:')}</p>
     <ul class="ck">
      <li>${L('<b>Regulatory</b> — تراخيص وشهادات','<b>Regulatory</b> — licenses, certifications')}</li>
      <li>${L('<b>Economic</b> — رأس مال كبير في الأول','<b>Economic</b> — high initial investment')}</li>
      <li>${L('<b>Competitive</b> — منافسين أقوياء وولاء عملاء','<b>Competitive</b> — strong rivals, customer loyalty')}</li></ul>
     <p style="margin-top:8px">✅ ${L('<b>الحل:</b> خطة لتقليل المخاطر + دوّر على <b>شريحة مهملة (Underserved niche)</b>.','<b>Solution:</b> mitigation plan + target an <b>underserved niche</b>.')}</p></div>
   </div>
   <div class="call tip"><span class="ci">🎯</span><div>${L('لو السؤال قال <b>comprehensive</b> → الإجابة دايمًا: ادرس <b>كل حاجة مع بعض</b> (ترندات + عوامل خارجية + منافسة + عوائق).','If a question says <b>comprehensive</b> → examine <b>everything together</b>.')}</div></div>
  </div>

  <div class="blk recap"><h2><span class="n">★</span>${L('5 حاجات لازم تفتكرها','5 things to remember')}</h2><ol>
   <li>${L('<b>Market Analysis</b>: افهم العملاء والمنافسين والفرص.','<b>Market Analysis</b>: customers, competitors, opportunities.')}</li>
   <li>${L('<b>Market Trends</b>: اكتشف التغيير في سلوك المستهلك — والزيادة المفاجئة مش دايمًا ترند.','<b>Trends</b>: spot changes — a spike isn\'t always a trend.')}</li>
   <li>${L('<b>Components</b>: عرض وطلب، عملاء، منافسين، PEST.','<b>Components</b>: supply/demand, customers, competitors, PEST.')}</li>
   <li>${L('<b>Sales Forecasting</b>: بيانات قديمة + ظروف السوق + 3 سيناريوهات.','<b>Forecasting</b>: history + market + 3 scenarios.')}</li>
   <li>${L('<b>Barriers to Entry</b>: تنظيمي، اقتصادي، تنافسي ← خطة + Niche.','<b>Barriers</b>: regulatory, economic, competitive → plan + niche.')}</li></ol></div>`
},
{ id:'s5', n:'05', c:'var(--s5)',
  title:{ar:'الجدوى القانونية والبيئية', en:'Legal & Environmental Feasibility'},
  desc:{ar:'العناصر القانونية، الأشكال القانونية والمسؤولية، مراحل وأبعاد التقييم البيئي، والقوائم البيضا والرمادي والسودا.', en:'Legal elements, business structures & liability, environmental stages, dimensions and White/Gray/Black lists.'},
  topics:['Legal Elements','Liability','Stages','Spatial / Temporal','White · Gray · Black'],
  lesson:(L)=>`
  <div class="blk"><h2><span class="n">1</span>${L('الفكرة الأساسية','The big idea')}</h2>
   <p>${L('المشروع ممكن يكون <b>مربح جدًا</b>… ومع ذلك <b>ميتعملش</b> لو مش قانوني أو بيضر البيئة بشكل مينفعش يتعالج. <b>Legal + Environmental = جزء من جدوى المشروع</b>.','A project can be <b>very profitable</b> yet <b>infeasible</b> if it is illegal or causes unfixable environmental harm.')}</p>
   <div class="vsbox">
    <div class="side a"><h3 class="en">⚖️ Legal Feasibility</h3><div class="q">${L('الأسئلة الأساسية','Key questions')}</div><ul class="ck">
     <li>${L('هل المشروع ملتزم بالقوانين واللوائح؟','Compliant with laws & regulations?')}</li>
     <li>${L('هل الشكل القانوني مناسب لأهداف البزنس؟','Does the legal structure fit the objectives?')}</li>
     <li>${L('هل فيه مخاطر قانونية محتملة؟','Any potential legal risks?')}</li></ul></div>
    <div class="vs">+</div>
    <div class="side b" style="--sx:var(--s5)"><h3 class="en">🌍 Environmental Feasibility</h3><div class="q">${L('الأسئلة الأساسية','Key questions')}</div><ul class="ck">
     <li>${L('إيه التأثيرات البيئية؟','What are the impacts?')}</li>
     <li>${L('ينفع نقللها (mitigate)؟','Can they be mitigated?')}</li>
     <li>${L('هل المشروع مستدام؟','Is it sustainable?')}</li></ul></div>
   </div>
  </div>

  <div class="blk"><h2><span class="n">2</span>${L('العناصر القانونية الأربعة','4 key legal elements')}</h2>
   <div class="g4">
    <div class="tile"><div class="ic">📋</div><h4><span class="en">Regulations & Licenses</span></h4><p>${L('لو الترخيص مش ممكن يطلع → المشروع ممكن <b>يقف</b> حتى لو مربح.','No license → project may be <b>blocked</b>, even if profitable.')}</p></div>
    <div class="tile"><div class="ic">🤝</div><h4><span class="en">Contracts & Agreements</span></h4><p>${L('بتوضح المسؤوليات وبتقلل <b>الخلافات</b> — لازم مواعيد تسليم وغرامات واضحة.','Clarify duties, reduce <b>disputes</b> — define deadlines & penalties.')}</p></div>
    <div class="tile"><div class="ic">®️</div><h4><span class="en">Intellectual Property</span></h4><p>${L('حماية اسم البراند والعلامة التجارية — مهمة <b>للصغير والكبير</b>.','Protect brand names — matters for <b>small & large</b> firms.')}</p></div>
    <div class="tile"><div class="ic">🏛️</div><h4><span class="en">Business Structure</span></h4><p>${L('الشكل القانوني — <b>مش قرار إداري وبس</b>، بيأثر على مسؤوليتك وتشغيل البزنس.','Not just admin — affects <b>liability & operations</b>.')}</p></div>
   </div>
  </div>

  <div class="blk"><h2><span class="n">3</span>${L('الأشكال القانونية والمسؤولية','Business structures & liability')}</h2>
   <div class="tblwrap"><table class="cmp"><thead><tr><th>${L('الشكل','Structure')}</th><th>${L('المسؤولية','Liability')}</th><th>${L('افتكرها كده','Remember it as')}</th></tr></thead><tbody>
    <tr><td class="en">👤 Sole Proprietorship</td><td><b style="color:var(--bad)">${L('غير محدودة','Unlimited')}</b></td><td>${L('تحكم كامل… بس أملاكك الشخصية في خطر','Full control… but personal assets at risk')}</td></tr>
    <tr><td class="en">👥 Partnership</td><td><b style="color:var(--s4)">${L('شخصية ومشتركة','Personal & joint')}</b></td><td>${L('الشركا مسؤولين مع بعض','Partners share responsibility')}</td></tr>
    <tr><td class="en">🏢 Limited Liability</td><td><b style="color:var(--ok)">${L('محدودة (حماية)','Limited (protection)')}</b></td><td>${L('بتحمي أملاكك الشخصية','Protects personal assets')}</td></tr>
    <tr><td class="en">🏬 Single-Person Company</td><td><b style="color:var(--ok)">${L('محدودة','Limited')}</b></td><td>${L('شخص واحد بس مسؤولية محدودة','One owner, limited liability')}</td></tr>
   </tbody></table></div>
   <div class="call mem"><span class="ci">🧠</span><div>${L('أي سؤال فيه "<b>عايز يحدد مسؤوليته الشخصية</b>" أو "<b>تجاهل الـ personal liability</b>" → الإجابة: <b>Legal structure</b>.','Any question about <b>limiting / ignoring personal liability</b> → <b>legal structure</b>.')}</div></div>
  </div>

  <div class="blk"><h2><span class="n">4</span>${L('التقييم البيئي: المراحل والأبعاد','Environmental assessment: stages & dimensions')}</h2>
   <p class="sub">${L('الجدوى البيئية = العلاقة بين المشروع والبيئة <b>في الاتجاهين</b> (كل واحد بيأثر على التاني).','Environmental feasibility = the <b>two-way</b> relationship between project and environment.')}</p>
   <div class="flow">
    <div class="fx"><b>📝 ${L('قبل','Before')}</b><small class="en">Planning</small></div><div class="ar">→</div>
    <div class="fx"><b>⚙️ ${L('أثناء','During')}</b><small class="en">Implementation / Construction</small></div><div class="ar">→</div>
    <div class="fx"><b>🌱 ${L('بعد','After')}</b><small class="en">Operation</small></div>
   </div>
   <div class="call warn"><span class="ci">⚠️</span><div>${L('لازم التقييم يغطي <b>كل المراحل</b>. مصنع تأثيره بسيط وقت البنا بس بيلوّث وقت التشغيل؟ → قيّم في كل مرحلة. ولو درست البيئة <b>بعد التشغيل بس</b> → غلطتك إنك أهملت <b>التخطيط المبكر</b>.','Assess <b>all stages</b>. Studying impacts <b>only after operation</b> ignores <b>early planning</b>.')}</div></div>
   <div class="g2" style="margin-top:14px">
    <div class="tile hl"><h4>🗺️ <span class="en">Spatial</span> — ${L('مكاني','place')}</h4><p>${L('التأثير وصل لفين؟ <b>محلي ← مجاور ← إقليمي ← عالمي</b>. (مش المكان اللي فيه المشروع بس)','Where? <b>local → neighboring → regional → global</b>.')}</p></div>
    <div class="tile hl"><h4>🕒 <span class="en">Temporal</span> — ${L('زمني','time')}</h4><p>${L('التأثير إمتى؟ <b>قصير المدى / طويل المدى</b> وفي مراحل عمر المشروع المختلفة.','When? <b>short / long term</b> across project life stages.')}</p></div>
   </div>
  </div>

  <div class="blk"><h2><span class="n">5</span>${L('التصنيف البيئي — زي إشارة المرور 🚦','Environmental classification 🚦')}</h2>
   <div class="g3 lights">
    <div class="tile light-w"><div class="ic">🌿</div><h4 class="en">White List</h4><p>${L('تأثير <b>بسيط</b> وتكلفة قليلة — ممكن ميحتاجش دراسة بيئية تفصيلية.','<b>Minimal</b> impact, low cost — may not need a detailed study.')}</p></div>
    <div class="tile light-g"><div class="ic">⚠️</div><h4 class="en">Gray List</h4><p>${L('تأثير <b>كبير</b> بس <b>ينفع يتقلل</b>… بتكلفة واستثمار <b>عالي</b> (تكنولوجيا غالية).','<b>Significant</b> but <b>mitigable</b> — at <b>high cost</b>.')}</p></div>
    <div class="tile light-b"><div class="ic">❌</div><h4 class="en">Black List</h4><p>${L('ضرر <b>خطير مش ممكن</b> يتجنب أو يتعالج — المشروع <b>ممكن يترفض</b>.','<b>Severe, unavoidable</b> damage — may be <b>rejected</b>.')}</p></div>
   </div>
   <div class="call mem"><span class="ci">🧠</span><div>${L('"ينفع يتعالج بس غالي" = <b>Gray</b> · "مستحيل يتعالج" = <b>Black</b>. (سؤال الـ Gray بـ "impossible" غلط!)','"Fixable but expensive" = <b>Gray</b> · "impossible to fix" = <b>Black</b>.')}</div></div>
  </div>

  <div class="blk"><h2><span class="n">6</span>${L('التنمية المستدامة','Sustainable development')}</h2>
   <p>${L('توازن بين 3 حاجات:','A balance between 3 things:')}</p>
   <div class="g3"><div class="tile" style="text-align:center"><div class="ic">🌱</div><h4 class="en">Environment</h4></div><div class="tile" style="text-align:center"><div class="ic">📈</div><h4 class="en">Economy</h4></div><div class="tile" style="text-align:center"><div class="ic">👨‍👩‍👧</div><h4 class="en">Society</h4></div></div>
  </div>

/* ================= helpers ================= */
function secProgress(id){
  const qs=QUESTIONS[id];let a=0,c=0;
  qs.forEach(q=>{if(q.id in S.stats){a++;if(S.stats[q.id]===1)c++}});
  return {total:qs.length,a,c};
}
function saveStats(){store.set('stats',S.stats)}
function go(view){S.view=view;render();window.scrollTo({top:0,behavior:'instant'in window?'instant':'auto'})}

/* ================= session ================= */
function makeSession(key,title,ids,c,meta={}){
  const list=S.shuffleQ||meta.random?shuffle(ids):ids.slice();
  const orders={};
  list.forEach(id=>{const q=ALLQ[id];orders[id]=q.t==='mc'?(S.shuffleO?shuffle(q.o.map((_,i)=>i)):q.o.map((_,i)=>i)):[0,1]});
  S.sess={key,title,ids:list,all:ids,orders,ans:{},idx:0,c,filter:'all',done:false,...meta};
}
function sessView(){
  const s=S.sess; if(!s) return [];
  if(s.filter==='all') return s.ids;
  return s.ids.filter(id=>ALLQ[id].t===s.filter);
}
function startSectionQuiz(id,filter='all'){
  const sec=secById(id);
  makeSession(id,sec.title,QUESTIONS[id].map(q=>q.id),sec.c);
  S.sess.filter=filter;
  go({name:'sec',id,tab:'quiz'});
}
function startExam(){
  const pool=[];S.exam.secs.forEach(id=>QUESTIONS[id].forEach(q=>pool.push(q.id)));
  if(!pool.length) return;
  const n=S.exam.count==='all'?pool.length:Math.min(S.exam.count,pool.length);
  const ids=shuffle(pool).slice(0,n);
  makeSession('exam',{ar:'الامتحان الشامل',en:'Full Exam'},ids,'var(--sx)',{exam:true});
  S.sess.ids=ids; // already random
  go({name:'exam'});
}
